<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1260" viewBox="0 0 920 1260" role="img" aria-labelledby="title desc">
  <title id="title">ECDSA Multi-Signer Flow</title>
  <desc id="desc">A single document hash is signed by two signers, producing separate signatures and verification results.</desc>

  <defs>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #0f172a; }
      .small { font-size: 13px; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .branchA { stroke: #0f766e; }
      .branchB { stroke: #7c2d12; }
      .accentA { fill: #ecfeff; stroke: #0f766e; }
      .accentB { fill: #fff7ed; stroke: #7c2d12; }
      .resultA { fill: #ecfdf5; stroke: #15803d; }
      .resultB { fill: #eff6ff; stroke: #1d4ed8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <rect x="350" y="20" width="220" height="64" rx="10" ry="10" class="box"/>
  <text x="460" y="59" text-anchor="middle" class="text">Contract.pdf</text>

  <rect x="335" y="130" width="250" height="64" rx="10" ry="10" class="box"/>
  <text x="460" y="169" text-anchor="middle" class="text">One SHA-256 hash</text>

  <rect x="120" y="260" width="280" height="72" rx="10" ry="10" class="box accentA"/>
  <text x="260" y="300" text-anchor="middle" class="text">Attorney A signs with Private Key A</text>

  <rect x="520" y="260" width="280" height="72" rx="10" ry="10" class="box accentB"/>
  <text x="660" y="300" text-anchor="middle" class="text">Attorney B signs with Private Key B</text>

  <rect x="150" y="390" width="220" height="62" rx="10" ry="10" class="box accentA"/>
  <text x="260" y="428" text-anchor="middle" class="text">Signature A</text>

  <rect x="550" y="390" width="220" height="62" rx="10" ry="10" class="box accentB"/>
  <text x="660" y="428" text-anchor="middle" class="text">Signature B</text>

  <rect x="125" y="505" width="270" height="62" rx="10" ry="10" class="box accentA"/>
  <text x="260" y="543" text-anchor="middle" class="text">Signature Record A</text>

  <rect x="525" y="505" width="270" height="62" rx="10" ry="10" class="box accentB"/>
  <text x="660" y="543" text-anchor="middle" class="text">Signature Record B</text>

  <rect x="95" y="620" width="330" height="62" rx="10" ry="10" class="box"/>
  <text x="260" y="658" text-anchor="middle" class="text">Verify with Public Key A</text>

  <rect x="495" y="620" width="330" height="62" rx="10" ry="10" class="box"/>
  <text x="660" y="658" text-anchor="middle" class="text">Verify with Public Key B</text>

  <rect x="130" y="742" width="260" height="62" rx="10" ry="10" class="box resultA"/>
  <text x="260" y="780" text-anchor="middle" class="text">Signer A result</text>

  <rect x="530" y="742" width="260" height="62" rx="10" ry="10" class="box resultB"/>
  <text x="660" y="780" text-anchor="middle" class="text">Signer B result</text>

  <path d="M460 84 L460 130" class="arrow"/>
  <path d="M460 194 L260 260" class="arrow"/>
  <path d="M460 194 L660 260" class="arrow"/>

  <path d="M260 332 L260 390" class="arrow branchA"/>
  <path d="M660 332 L660 390" class="arrow branchB"/>

  <path d="M260 452 L260 505" class="arrow branchA"/>
  <path d="M660 452 L660 505" class="arrow branchB"/>

  <path d="M260 567 L260 620" class="arrow branchA"/>
  <path d="M660 567 L660 620" class="arrow branchB"/>

  <path d="M260 682 L260 742" class="arrow branchA"/>
  <path d="M660 682 L660 742" class="arrow branchB"/>
</svg>
